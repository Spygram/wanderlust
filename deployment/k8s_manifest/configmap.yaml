# Non-secret runtime config for the backend.
#
# Key names here MUST match `process.env.*` reads in backend/config/utils.ts.
# The old configmap.yaml.j2 shipped DB_HOST / DB_PORT / DB_NAME, none of which
# the application ever reads.
#
# NOTE: MONGODB_URI has no credentials in it. The backend builds its connection
# from MONGODB_URI alone (config/db.ts calls mongoose.connect(MONGODB_URI)), so
# if you enable Mongo auth you must put the full URI in the Secret instead and
# drop it from here. See README.
apiVersion: v1
kind: ConfigMap
metadata:
  name: backend-config
  # namespace: wanderlust
  labels:
    name: backend
    # part-of: wanderlust
data:
  NODE_ENV: "Development"
  PORT: "5000"

  MONGODB_URI: "mongodb://mongodb:27017/wanderlust"
  MONGODB_DB_NAME: "wanderlust"
  REDIS_URL: "redis://redis:6379"

  # Public URLs. FRONTEND_URL feeds the CORS allow-list in app.ts, and
  # BACKEND_URL is used to build the Google OAuth callback.
  FRONTEND_URL: "https://frontend.sujandongol.com.np"
  BACKEND_URL: "https://backend.sujandongol.com.np"

  # Token / cookie lifetimes. Values are strings; utils.ts parses them.
  ACCESS_COOKIE_MAXAGE: "120000"
  ACCESS_TOKEN_EXPIRES_IN: "120s"
  REFRESH_COOKIE_MAXAGE: "120000"
  REFRESH_TOKEN_EXPIRES_IN: "120s"

  # cookie_options.ts: `const isHttps = process.env.USE_HTTPS === 'true'`
  # -> sets the cookie Secure flag. Must be the literal string "true" when
  # served over HTTPS, otherwise browsers reject the auth cookie.
  # USE_HTTPS: "true"
  
