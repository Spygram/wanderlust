# ---------------------------------------------------------------------------
# EXAMPLE ONLY -- DO NOT COMMIT A FILLED-IN COPY OF THIS FILE.
#
# Copy to secret.yaml, fill in real values, apply, and keep secret.yaml out of
# git (.gitignore already covers k8s/secrets/secret.yaml).
#
# `stringData` takes plain text -- Kubernetes base64-encodes it for you. This is
# deliberately different from the old configsecret.j2, which used the
# `| b64encode` Jinja filter into a `data:` block. That works, but it means the
# rendered file on disk looks encrypted while being trivially reversible, which
# invites people to commit it. Plain stringData is more honest.
#
# JWT_SECRET is REQUIRED. backend/config/utils.ts does:
#     process.env.JWT_SECRET ?? throwError('JWT_SECRET is not defined')
# so the container throws on startup and CrashLoopBackOffs without it.
#
# Generate strong values:
#     openssl rand -base64 48
# ---------------------------------------------------------------------------
apiVersion: v1
kind: Secret
metadata:
  name: backend-secret
  namespace: wanderlust
  labels:
    name: backend
    part-of: wanderlust
type: Opaque
stringData:
  # REQUIRED -- app refuses to boot without it.
  #
  # !! backend/.env.sample on the `sujan` branch contains a REAL-LOOKING
  # !! 128-hex JWT_SECRET committed to git. Treat it as compromised: generate
  # !! a fresh one here and scrub the sample file.
  JWT_SECRET: "replace-me-openssl-rand-base64-48"

  # app.ts: `session({ secret: process.env.SESSION_SECRET || 'secret' })`
  # Falls back to the literal string "secret" -- always set this.
  SESSION_SECRET: "replace-me-openssl-rand-base64-48"

  # Google OAuth. Only needed if you use the /api/auth Google routes.
  GOOGLE_CLIENT_ID: "replace-me.apps.googleusercontent.com"
  GOOGLE_CLIENT_SECRET: "replace-me"

  # Mongo credentials.
  #
  # These are NOT read by the application -- backend/config/utils.ts exports
  # MONGODB_USER / MONGODB_PASSWORD but nothing consumes them. They are here
  # because the mongodb StatefulSet uses them to initialise the root user.
  #
  # If you turn on Mongo auth, ALSO move MONGODB_URI out of the ConfigMap and
  # into this Secret with credentials embedded, e.g.:
  #   MONGODB_URI: "mongodb://wanderlust:PASSWORD@mongodb:27017/wanderlust?authSource=admin"
  MONGODB_USER: "wanderlust"
  MONGODB_PASSWORD: "replace-me"
