apiVersion: apps/v1
kind: Deployment
metadata:
  name: mongodb-exporter
  namespace: monitoring
spec:
  replicas: 1
  selector:
    matchLabels: { app: mongodb-exporter }
  template:
    metadata:
      labels: { app: mongodb-exporter }
    spec:
      containers:
        - name: mongodb-exporter
          image: percona/mongodb_exporter:0.40
          args:
            - "--mongodb.uri=mongodb://$(MONGODB_USER):$(MONGODB_PASSWORD)@mongodb:27017/admin?authSource=admin"
          envFrom:
            - secretRef: { name: backend-secret }
          ports:
            - containerPort: 9216
---
apiVersion: v1
kind: Service
metadata:
  name: mongodb-exporter
  namespace: monitoring
  labels: { app: mongodb-exporter }
spec:
  selector: { app: mongodb-exporter }
  ports:
    - port: 9216

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: mongodb-exporter-ingress
  namespace: monitoring
spec:
  ingressClassName: nginx
  rules:
  - host: mongoexporter.sujandongol.com.np 
    http:
      paths:
      - pathType: Prefix
        path: /
        backend:
          service:
            name: mongodb-exporter
            port:
              number: 9216    